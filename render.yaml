services:
  - type: web
    name: skillsphere
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SERVER_TYPE
        value: "wsgi" # Change to 'asgi' if you wish to run with Uvicorn ASGI
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: DATABASE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@skillsphere.app"
      - key: DJANGO_SUPERUSER_PASSWORD
        value: "admin12345"
