services:
  - type: web
    name: skillsphere
    runtime: python
    plan: free
    region: oregon
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SERVER_TYPE
        value: "wsgi" # Set to 'wsgi' for Gunicorn or 'asgi' for Uvicorn
      - key: DATABASE_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@skillsphere.app"
      - key: DJANGO_SUPERUSER_PASSWORD
        value: "admin12345"
